# Настройки этой установки бота.
#
# Здесь лежит то, что у каждого своё: чей это бот, куда приходить клиенту
# и в каком файле искать ключ доступа сообщества. В коде таких значений нет —
# код у всех одинаковый, меняется только этот файл. Поставить бота другому
# мастеру — значит поправить config.cfg и положить рядом свой token.txt,
# ни строчки на Python.
#
# Правила такие:
#
#   * формат обычный ini: раздел в квадратных скобках, дальше «имя = значение»;
#   * файл читается как UTF-8, русские буквы можно писать как есть;
#   * строка, начинающаяся с решётки, — комментарий. В середине строки решётка
#     считается обычным символом, поэтому адрес «д. 999А # 2» не сломается;
#   * кавычки не нужны: значение — это всё, что стоит после «=» до конца
#     строки. Пробелы по краям обрезаются;
#   * все имена ниже обязательны. Если строки нет или она пустая, бот
#     не запускается и пишет, чего именно ему не хватает. Это лучше, чем
#     разослать клиентам приветствие без адреса и узнать об этом от них;
#   * единственное исключение — owner_id: ноль или пусто означает
#     «мастера нет», и бот работает только на клиента.

[community]

# Файл, в котором лежит ключ доступа сообщества. Сам ключ здесь не пишем:
# этот файл спокойно едет в git, а ключ туда попадать не должен ни при каких
# обстоятельствах — token.txt для того и стоит в .gitignore.
#
# Путь считается от каталога с кодом, но можно указать и полный.
token_file = token.txt

# VK ID мастера. Ему бот пишет о новых записях, отменах и переносах, и только
# у него в главном меню появляется кабинет. Свой номер видно в адресе
# страницы (vk.com/idNNN) или через любой сервис «узнать id».
#
# Мастер при этом остаётся обычным клиентом: записаться сам он может, просто
# получит об этом сообщение. Отдельной роли в боте нет.
#
# 0 или пусто — уведомлений и кабинета нет. Так и надо оставлять в чужой
# копии проекта: иначе бот будет пытаться написать неизвестно кому.
owner_id = 203719182

[salon]

# Куда приходить и куда звонить. Клиент видит эти две строки в приветствии,
# на экране подтверждения записи, сразу после записи и после подписки —
# то есть ровно тогда, когда и спрашивает «а где вы находитесь?».
#
# Телефона может не быть, но пустым оставлять нельзя: напишите, например,
# «пишите сюда, в сообщения сообщества» — клиенту это понятнее, чем пустая
# строка «Телефон:».
address = г. Пенза, ул. Московская, д. 999А
phone = +7 777 777-77-77
